[package]
name = "snowhush-x11"
version = "0.13.2"
edition = "2024"
publish = false
description = "Snowhush on X11 (GNOME on Xorg): a port of linux/ for personal use"

[[bin]]
name = "snowhush-x11"
path = "src/main.rs"

[dependencies]
snowhush-core = { path = "../core" }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
glow = "0.18"
calloop = { version = "0.14", features = ["signals"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
x11-dl = "2.21"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
